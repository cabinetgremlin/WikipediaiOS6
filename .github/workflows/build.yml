name: Build iOS 6 App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos Toolchain
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Download Legacy 32-bit SDK
        run: |
          git clone --depth 1 https://github.com/hexedtext/sdks.git $THEOS/sdks/legacy_sdks || true
          cp -r $THEOS/sdks/legacy_sdks/* $THEOS/sdks/ || true

      - name: Build Application Package
        run: |
          make package FINALPACKAGE=1

      - name: Upload Built Package
        uses: actions/upload-artifact@v4
        with:
          name: WikipediaiOS6-App
          path: |
            packages/*.deb
            packages/*.ipa
            *.deb
